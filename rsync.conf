# rsync.conf.example
# Copy to rsync.conf (same folder as rsync.sh) and fill in your own values.
# Keep rsync.conf out of version control.

# Host to pull from (address or name reachable over SSH with key authentication)
SERVER="192.168.1.100"

# Folder on the server to copy. Must be a mount point; the sync aborts otherwise.
SRC_DIR="/mnt/MEDIA"

# Local folder to mirror into. Files not present on the server are deleted here.
DEST="/home/pi/frame/videos/"

# Names to skip, separated by spaces (no spaces within a name). May be empty.
EXCLUDES="@Recycle"
  
